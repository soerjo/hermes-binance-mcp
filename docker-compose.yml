# Binance Futures MCP Server — Docker Compose
#
# Usage:
#   cp .env.template .env   # fill in API keys
#   docker compose up -d
#
# Hermes config.yaml — tambah di mcp_servers:
#   binance:
#     url: http://localhost:8811/sse
#     transport: sse
#     enabled: true

services:
  binance-mcp:
    build: .
    container_name: binance-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8811:8811"   # localhost-only by default
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8811"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; socket.create_connection(('localhost', 8811), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
