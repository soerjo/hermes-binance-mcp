# Binance Futures MCP Server with VPN Sidecar (Gluetun)
#
# Configured for OpenVPN custom config in ./vpn/client.ovpn
# Uses DOT=off and plaintext 1.1.1.1 DNS to prevent CNAME resolution timeouts on AWS ALB.

services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: binance-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8811:8811"
    volumes:
      - ./vpn:/gluetun
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=openvpn
      - OPENVPN_CUSTOM_CONFIG=/gluetun/client.ovpn
      - DOT=off
      - DNS_PLAINTEXT_ADDRESS=1.1.1.1
    healthcheck:
      test: ["CMD", "ping", "-c", "1", "1.1.1.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  binance-mcp:
    build: .
    image: hermes-binance-mcp-binance-mcp:latest
    container_name: binance-mcp
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8811
      - LOG_LEVEL=INFO
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
